{% extends 'base.html' %}
{% block content %}
<h1>Delete Event?</h1>
<p>Are you sure you want to delete "<strong>{{ event.title }}</strong>"? This can't be undone.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
</form>
<a href="{% url 'event_detail' event.id %}">Cancel</a>
{% endblock %}
