{% extends 'base.html' %}
{% block content %}
<h1>Upcoming Events</h1>
<a href="{% url 'event_create' %}">+ Create Event</a>

<form method="get">
    <input type="text" name="search" placeholder="Search by title" value="{{ search_query|default:'' }}">
    <input type="text" name="city" placeholder="Filter by city" value="{{ selected_city|default:'' }}">
    <select name="category">
        <option value="">All Categories</option>
        {% for value, label in categories %}
            <option value="{{ value }}" {% if selected_category == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
    <button type="submit">Filter</button>
    <a href="{% url 'event_list' %}">Clear</a>
</form>

<ul>
    {% for event in events %}
        <li>
            <strong><a href="{% url 'event_detail' event.id %}">{{ event.title }}</a></strong> — {{ event.get_category_display }}<br>
            {{ event.city }}, {{ event.state }} — {{ event.start_time }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
