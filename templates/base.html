<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Local Community{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'event_list' %}">Events</a>
        {% if user.is_authenticated %}
            | <a href="{% url 'event_create' %}">Create Event</a>
            | Logged in as {{ user.username }}
            | <form method="post" action="{% url 'logout' %}" style="display: inline;">
    {% csrf_token %}
    <button type="submit" style="background: none; border: none; padding: 0; color: blue; text-decoration: underline; cursor: pointer;">Log out</button>
</form>
        {% else %}
            | <a href="{% url 'login' %}">Log in</a>
            | <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
