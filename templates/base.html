{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Grassroot{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <button id="sidebar-toggle" aria-label="Open menu">☰</button>

    <div id="sidebar-overlay"></div>

    <aside id="sidebar">
        <h2><a href="{% url 'event_list' %}">Grassroot</a></h2>
        <nav>
            <a href="{% url 'event_list' %}">Events</a>
            {% if user.is_authenticated %}
                <a href="{% url 'event_create' %}">Create Event</a>
                <a href="{% url 'profile' %}">Profile</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </aside>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        const toggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
        }

        toggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        });

        overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
